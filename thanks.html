<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>送信完了｜はたらくナビすぐワーク</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    .thanks-page{min-height:100vh;display:grid;place-items:center;padding:30px;background:linear-gradient(145deg,#f3f8ff,#fff)}
    .thanks-card{width:min(620px,100%);padding:48px 30px;border-radius:26px;background:#fff;box-shadow:0 20px 55px rgba(0,54,130,.14);text-align:center}
    .thanks-card img{width:280px;margin:0 auto 26px}
    .thanks-card h1{margin:0 0 12px;color:#003f9e;font-size:34px}
    .thanks-card p{color:#5c6f88}
    .thanks-card a{display:inline-flex;align-items:center;justify-content:center;min-height:54px;margin-top:18px;padding:12px 28px;border-radius:999px;color:#fff;background:#005bd7;font-weight:900}
  </style>
</head>
<body>
  <main class="thanks-page">
    <section class="thanks-card">
      <img src="assets/img/logo.svg" alt="はたらくナビすぐワーク">
      <h1>送信が完了しました</h1>
      <p>内容を確認後、担当者から電話またはSMSでご連絡します。</p>
      <a href="index.html">トップページへ戻る</a>
    </section>
  </main>
</body>
</html>
