<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>応募受付完了｜はたらくナビすぐワーク</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    .thanks-page{min-height:100vh;display:grid;place-items:center;padding:30px;background:linear-gradient(145deg,#eef6ff,#fff8dc)}
    .thanks-card{width:min(100%,680px);text-align:center;background:#fff;border:1px solid #d8e3ee;border-radius:28px;padding:54px 30px;box-shadow:0 22px 60px rgba(11,46,89,.14)}
    .thanks-icon{display:grid;place-items:center;width:86px;height:86px;margin:0 auto 22px;border-radius:50%;color:#fff;background:#1967d2;font-size:42px;font-weight:900}
    .thanks-card h1{margin:0;color:#0b2e59;font-size:34px}.thanks-card p{color:#5d7185}.thanks-card .button{margin-top:18px}
  </style>
</head>
<body>
  <main class="thanks-page">
    <div class="thanks-card">
      <div class="thanks-icon">✓</div>
      <h1>ご応募ありがとうございます。</h1>
      <p>内容を確認後、担当者から電話またはSMSでご連絡します。<br>お急ぎの場合は、092-600-3558までお電話ください。</p>
      <a class="button button-primary" href="index.html">トップページへ戻る</a>
    </div>
  </main>
</body>
</html>
